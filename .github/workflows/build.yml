name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'

    - name: Find Gradle project root
      id: find-root
      run: |
        proj=$(git ls-files | grep -m1 -E '(^|/)settings\.gradle(\.kts)?$' || true)
        if [ -z "$proj" ]; then
          echo "No settings.gradle(.kts) found in repo."
          exit 1
        fi
        echo "project_root=$(dirname "$proj")" >> "$GITHUB_OUTPUT"

    - name: Build APK with Gradle
      working-directory: ${{ steps.find-root.outputs.project_root }}
      run: gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: ${{ steps.find-root.outputs.project_root }}/app/build/outputs/apk/debug/app-debug.apk
